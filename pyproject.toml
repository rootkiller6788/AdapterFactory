[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adapterfactory"
version = "0.1.0"
description = "AdapterFactory —— Adapter 生命周期（登记 / 组合 / Merge / 冲突 / 部署）的显微镜与实验台（零第三方依赖）"
# 核心链路只用标准库。requires-python 下限由 math.sumprod 决定（CPython 3.12+）：
# 它是本项目的性能底线 —— 组合空间有几百个配置，每个都要跑若干次前向，
# 手写三重循环会让整条流水线从「一分钟」变成「几十分钟」。
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# 重型接入点一律写成抛 NotImplementedError 的扩展点，不放进核心链路。
torch = ["torch>=2.2"]
peft = ["peft>=0.11"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
